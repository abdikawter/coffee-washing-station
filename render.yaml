# Render Blueprint — https://render.com/docs/blueprint-spec
# Creates: PostgreSQL 16, the API Web Service (with in-process pg-boss worker), the React Static Site.
# After the first sync set the secrets marked `sync: false` in the Render dashboard.
databases:
  - name: cws-db
    databaseName: cws
    user: cws
    postgresMajorVersion: "16"
    plan: basic-256mb

services:
  - type: web
    name: cws-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci && npm run build
    # migrate → seed → server. Both steps are idempotent; the migrator takes an advisory lock.
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: cws-db, property: connectionString }
      - key: DATABASE_SSL
        value: "false"          # internal connection; set true for the external URL
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false             # e.g. https://cws-web.onrender.com (or your custom domain)
      - key: REFRESH_COOKIE_SAMESITE
        value: none             # "strict" once app/api share a custom domain
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false             # e.g. https://<account>.r2.cloudflarestorage.com (empty for AWS)
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_PASSWORD
        sync: false             # used once, when no SUPER_ADMIN exists; must be changed at first login
      - key: SWAGGER_ENABLED
        value: "true"

  - type: web
    name: cws-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_API_BASE_URL
        sync: false             # e.g. https://cws-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
